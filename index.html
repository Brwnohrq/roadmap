<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roadmap</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
    <h1>Roadmap</h1>
    <p id="resumo"></p>

    <div id="cartoes"></div>

    <section class="adicionar">
        <h2>Adicionar matéria de estudo</h2>
        <div class="campos">
            <input type="text" id="caixaEstudo" placeholder="Matéria de estudo">
            <input type="text" id="caixaEscolha" placeholder="Em qual seção (nova ou existente)">
            <button id="botao">Adicionar</button>
        </div>
    </section>

    <button id="restaurar">Restaurar trilha original</button>
</main>

<script src="script.js"></script>
</body>

</html>
